- type: entity
  id: FoodTomatoSlice
  parent: ProduceSliceBase
  name: tomato slice
  description: A fresh slice of tomato.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tomato.rsi
    state: produce
    scale: 0.75, 0.75
  - type: FlavorProfile
    flavors:
    - tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.5
        - ReagentId: Vitamin
          Quantity: 1.5
        - ReagentId: Water
          Quantity: 2
  - type: SliceableFood
    count: 1
    slice: FoodTomatoDiced
  - type: BoilableFood
    result: FoodTomatoBoiled
    reagentConversions:
      Nutriment: TomatoSauce
      Vitamin: TomatoSauce
      Water: TomatoSauce
  - type: Tag
    tags:
    - Vegetable
    - Slice

- type: entity
  id: FoodTomatoDiced
  parent: ProduceSliceBase
  name: diced tomato
  description: Small pieces of fresh tomato.
  components:
  - type: BoilableFood
    result: FoodTomatoBoiled
    cookingTime: 10
    reagentConversions:
      Nutriment: TomatoSauce
      Vitamin: TomatoSauce
      Water: TomatoSauce
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tomato.rsi
    state: produce
    scale: 0.5, 0.5
  - type: FlavorProfile
    flavors:
    - tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.5
        - ReagentId: Vitamin
          Quantity: 1.5
        - ReagentId: Water
          Quantity: 2
  - type: Tag
    tags:
    - Vegetable

- type: entity
  id: FoodTomatoBoiled
  parent: FoodProduceBase
  name: boiled tomato
  description: A soft, blanched tomato ready to be ground into pasta sauce.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tomato.rsi
    state: produce
    color: "#dd9070"
  - type: FlavorProfile
    flavors:
    - tomato
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 14
        reagents:
        - ReagentId: TomatoSauce
          Quantity: 14
  - type: Extractable
    grindableSolutionName: food
  - type: Tag
    tags:
    - Vegetable

- type: entity
  id: FoodPastaDry
  parent: FoodNoodlesBase
  name: dry pasta
  description: Uncooked pasta waiting for a pot of boiling water.
  components:
  - type: Sprite
    state: boiled
    color: "#e0bd63"
  - type: FlavorProfile
    flavors:
    - pasta
  - type: BoilableFood
    result: FoodNoodlesBoiled
    cookingTime: 20

- type: entity
  id: FoodOnionDiced
  parent: ProduceSliceBase
  name: diced onion
  description: Small pieces of onion.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/onion.rsi
    state: slice
    scale: 0.5, 0.5
  - type: FlavorProfile
    flavors:
    - onion
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Allicin
          Quantity: 1
        - ReagentId: Vitamin
          Quantity: 1
  - type: Tag
    tags:
    - Vegetable

- type: entity
  id: FoodOnionRedDiced
  parent: FoodOnionDiced
  name: diced red onion
  description: Small pieces of red onion.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/onion_red.rsi