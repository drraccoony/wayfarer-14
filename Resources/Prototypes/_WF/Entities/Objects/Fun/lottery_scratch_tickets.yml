# Base lottery ticket entity with common properties
- type: entity
  parent: BaseItem
  id: LotteryScratchTicketBase
  name: lottery scratch ticket
  description: A lottery scratch ticket. Scratch off the coating to reveal if you're a winner!
  abstract: true
  components:
  - type: Sprite
    sprite: _WF/Objects/Fun/lottery_scratch_tickets.rsi
    state: ticket_unscratched
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Document
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 25
  # Custom data for lottery mechanics - to be implemented in code
  # These are stored as metadata for future system implementation
  - type: StaticPrice
    price: 0 # Will be overridden by variants

# Cheap Lottery Ticket - Low risk, low reward
- type: entity
  parent: LotteryScratchTicketBase
  id: LotteryScratchTicketCheap
  name: cheap lottery ticket
  suffix: 500cr
  description: A basic lottery scratch ticket. It's cheap, but the prizes are modest. Costs 500 credits, max winnings 5000 credits.
  components:
  - type: Sprite
    layers:
    - state: ticket_unscratched
      color: "#90EE90" # Light green for cheap
  - type: StaticPrice
    price: 500
  - type: WFLotteryTicket
    purchaseCost: 500
    minWinnings: 0
    maxWinnings: 5000
    winChance: 0.15
    breakEvenChance: 0.05
    payoutTiers:
      5000: 0.01
      2500: 0.02
      1000: 0.05
      500: 0.05
      0: 0.87

