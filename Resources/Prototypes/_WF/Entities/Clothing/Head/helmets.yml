# Tactical Helmet
- type: entity
  parent: [ClothingHeadHelmetAccessoryHolder, ClothingHeadHelmetArmoredBase ]
  id: ClothingHeadHelmetBM
  name: tactical helmet
  description: A tactical helmet procured from the Black Market. Comes with a flash resistant visor.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/Helmets/security.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Helmets/security.rsi
  - type: FlashImmunity
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HideLayerClothing
    layers:
      Hair: HEAD
  - type: Contraband
    severity: BlackMarket
    turnInValues:
      FrontierUplinkCoin: 1
      
